<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bitscan.theme")
          var theme = stored === "dark" ? "black" : stored === "dim" || stored === "black" ? stored : "light"
          if (stored === "dark" || stored === "auto") localStorage.setItem("bitscan.theme", theme)
          document.documentElement.setAttribute("data-theme", theme)
          if (theme !== "light") document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark"
        } catch (e) {}
        try {
          var langs = ["en","zh","zh-TW","ko","ru","ja","vi","id","es","pt","fr","ar","fa","uk"]
          var tags = {"en":"en-US","zh":"zh-CN","zh-TW":"zh-TW","ko":"ko-KR","ru":"ru-RU","ja":"ja-JP","vi":"vi-VN","id":"id-ID","es":"es-ES","pt":"pt-BR","fr":"fr-FR","ar":"ar-u-nu-latn","fa":"fa-IR-u-nu-latn-ca-gregory","uk":"uk-UA"}
          var saved = localStorage.getItem("bitscan.lang")
          var lang = saved && langs.indexOf(saved) >= 0 ? saved : ""
          if (!lang) {
            var list = []
            if (navigator.languages) list = list.concat(navigator.languages)
            if (navigator.language) list.push(navigator.language)
            for (var i = 0; i < list.length; i++) {
              var raw = list[i]
              if (!raw) continue
              var tag = String(raw).toLowerCase().replace(/_/g, "-")
              var base = tag.split("-")[0]
              if (base === "zh") {
                lang = tag.indexOf("hant") >= 0 || tag.indexOf("zh-tw") === 0 || tag.indexOf("zh-hk") === 0 || tag.indexOf("zh-mo") === 0 ? "zh-TW" : "zh"
                break
              }
              if (langs.indexOf(base) >= 0) { lang = base; break }
            }
          }
          if (!lang) lang = "en"
          document.documentElement.lang = tags[lang] || lang
          document.documentElement.dir = lang === "ar" || lang === "fa" ? "rtl" : "ltr"
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BitSharesScan is a BitShares blockchain explorer: blocks, transactions, accounts, assets, witnesses, and the DEX."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BitShares (BTS) Blockchain Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
